name: Build and Release Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/
        shell: powershell

      - name: Clear npm cache
        run: npm cache clean --force
        shell: powershell

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps
        shell: powershell
        env:
          npm_config_registry: https://registry.npmjs.org/

      - name: Build desktop app
        working-directory: ./frontend
        run: npm run build:desktop
        shell: powershell

      - name: Check for build output
        run: |
          if (Test-Path "frontend/dist/*.exe") {
            Write-Host "Installer file found"
            Get-Item "frontend/dist/*.exe" | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "ERROR: No .exe file found in frontend/dist/"
            Get-ChildItem -Recurse frontend/
            exit 1
          }
        shell: powershell

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: installer
          path: frontend/dist/*.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: frontend/dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release (on main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v3
        with:
          name: latest-installer
          path: frontend/dist/*.exe
